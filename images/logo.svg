<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="medBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="medTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Outer Shield / Container -->
  <rect x="15" y="15" width="90" height="90" rx="26" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" filter="url(#softGlow)"/>
  
  <!-- Medical Cross with Rounded Ends -->
  <path d="M48 30 H72 V48 H90 V72 H72 V90 H48 V72 H30 V48 H48 Z" fill="url(#medBlue)" rx="8" />
  
  <!-- AI Neural Network Nodes in Teal -->
  <circle cx="60" cy="60" r="11" fill="#ffffff" />
  <circle cx="60" cy="60" r="7" fill="url(#medTeal)" />

  <!-- Neural Connection Lines -->
  <line x1="60" y1="49" x2="60" y2="35" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="60" y1="71" x2="60" y2="85" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="49" y1="60" x2="35" y2="60" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="71" y1="60" x2="85" y2="60" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Satellite Nodes -->
  <circle cx="60" cy="35" r="4.5" fill="#ccfbf1" stroke="#0d9488" stroke-width="2" />
  <circle cx="60" cy="85" r="4.5" fill="#ccfbf1" stroke="#0d9488" stroke-width="2" />
  <circle cx="35" cy="60" r="4.5" fill="#ccfbf1" stroke="#0d9488" stroke-width="2" />
  <circle cx="85" cy="60" r="4.5" fill="#ccfbf1" stroke="#0d9488" stroke-width="2" />

  <!-- Heartbeat ECG line inside central pulse -->
  <path d="M54 60 L57 60 L59 55 L61 65 L63 60 L66 60" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
