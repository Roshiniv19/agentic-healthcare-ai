<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <filter id="shadow1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#0369a1" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Decorative Shapes -->
  <circle cx="500" cy="100" r="80" fill="#ccfbf1" opacity="0.6"/>
  <circle cx="100" cy="350" r="120" fill="#e0f2fe" opacity="0.5"/>
  <path d="M50 80 Q 80 40 120 70 T 190 60" stroke="#bae6fd" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="6,6"/>

  <!-- Central Intelligence Tablet / Holographic Dashboard -->
  <g filter="url(#shadow1)">
    <rect x="150" y="70" width="300" height="320" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    
    <!-- Header bar -->
    <rect x="150" y="70" width="300" height="50" rx="20" fill="#f8fafc"/>
    <rect x="150" y="100" width="300" height="20" fill="#f8fafc"/>
    <circle cx="180" cy="95" r="6" fill="#ef4444"/>
    <circle cx="196" cy="95" r="6" fill="#f59e0b"/>
    <circle cx="212" cy="95" r="6" fill="#10b981"/>
    <text x="250" y="100" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0369a1">Agentic AI Hub v2.4</text>

    <!-- Vital Pulse Display -->
    <rect x="175" y="135" width="250" height="70" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <text x="190" y="155" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#15803d">PATIENT VITALS • NORMAL</text>
    <path d="M190 180 L230 180 L240 165 L248 195 L256 170 L264 185 L272 180 L350 180 L360 160 L368 190 L376 180 L400 180" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="365" y="155" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f766e">72 BPM</text>

    <!-- Multi-Agent Status Cards -->
    <rect x="175" y="215" width="120" height="65" rx="10" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1"/>
    <circle cx="195" cy="235" r="8" fill="#0284c7"/>
    <text x="210" y="238" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0369a1">Triage AI</text>
    <text x="190" y="262" font-family="system-ui, sans-serif" font-size="10" fill="#0284c7">Risk Score: 12%</text>

    <rect x="305" y="215" width="120" height="65" rx="10" fill="#ccfbf1" stroke="#5eead4" stroke-width="1"/>
    <circle cx="325" cy="235" r="8" fill="#0d9488"/>
    <text x="340" y="238" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f766e">Pharma AI</text>
    <text x="320" y="262" font-family="system-ui, sans-serif" font-size="10" fill="#0d9488">0 Interaction Flag</text>

    <!-- Medical AI Summary box -->
    <rect x="175" y="290" width="250" height="80" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <circle cx="195" cy="310" r="10" fill="#0284c7"/>
    <path d="M192 310 L195 313 L199 307" stroke="#ffffff" stroke-width="1.8" fill="none"/>
    <text x="215" y="313" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Clinical Recommendation</text>
    <text x="190" y="333" font-family="system-ui, sans-serif" font-size="10" fill="#475569">Symptoms aligned with seasonal rhinitis.</text>
    <text x="190" y="350" font-family="system-ui, sans-serif" font-size="10" fill="#0284c7" font-weight="600">Recommending: Telehealth follow-up</text>
  </g>

  <!-- Left Floating Agent: Dr. AI / Coordinator -->
  <g filter="url(#shadow1)">
    <rect x="50" y="160" width="130" height="90" rx="14" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
    <circle cx="80" cy="195" r="18" fill="url(#primaryGrad)"/>
    <!-- Stethoscope icon inside -->
    <path d="M74 190 V197 C74 202 86 202 86 197 V190" stroke="#ffffff" stroke-width="2" fill="none"/>
    <circle cx="86" cy="190" r="3" fill="#ffffff"/>
    <text x="70" y="235" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0369a1">Active Agent</text>
    <circle cx="145" cy="180" r="5" fill="#10b981"/>
  </g>

  <!-- Right Floating Badge: Security & Privacy Compliance -->
  <g filter="url(#shadow1)">
    <rect x="420" y="120" width="140" height="85" rx="14" fill="#ffffff" stroke="#99f6e4" stroke-width="1.5"/>
    <circle cx="450" cy="155" r="18" fill="url(#tealGrad)"/>
    <!-- Shield check icon -->
    <path d="M444 153 L449 158 L457 150" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text x="475" y="148" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0f766e">Safety Guardrailed</text>
    <text x="475" y="165" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Encrypted Vitals</text>
    <rect x="475" y="172" width="60" height="12" rx="6" fill="#ccfbf1"/>
    <text x="483" y="181" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#0f766e">100% Secure</text>
  </g>

  <!-- Floating Chat Notification bubble -->
  <g filter="url(#shadow1)">
    <rect x="400" y="270" width="170" height="70" rx="16" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
    <circle cx="425" cy="305" r="14" fill="#0284c7"/>
    <path d="M421 305 H429 M425 301 V309" stroke="#ffffff" stroke-width="2"/>
    <text x="448" y="300" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Emergency Filter</text>
    <text x="448" y="318" font-family="system-ui, sans-serif" font-size="9" fill="#15803d" font-weight="600">✓ No red flags detected</text>
  </g>

  <!-- Connecting Data Lines / Particle dots -->
  <path d="M180 205 C 160 215, 140 215, 120 205" stroke="#0284c7" stroke-width="2" stroke-dasharray="4,4" fill="none"/>
  <path d="M420 162 C 440 180, 430 200, 405 215" stroke="#0d9488" stroke-width="2" stroke-dasharray="4,4" fill="none"/>
</svg>
